<!doctype html>
<html lang="en" class="wa-cloak">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneGate Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#4f46e5">
  <script>
    // Apply the theme class before first paint. Manual choice wins, then OS preference.
    (() => {
      const stored = localStorage.getItem("onegate_theme");
      const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.add(dark ? "wa-dark" : "wa-light");
    })();
  </script>
  <link rel="stylesheet" href="vendor/webawesome/styles/webawesome.css">
  <link rel="stylesheet" href="claw-theme.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="vendor/webawesome/webawesome.loader.js" data-webawesome="vendor/webawesome"></script>
</head>
<body>

  <!-- Token entry screen -->
  <div id="auth-screen" class="auth-screen hidden">
    <form id="auth-form" class="auth-card wa-card-look" autocomplete="off">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="35" r="10" fill="currentColor" opacity=".16"/><path d="M19 49V31C19 21.4 24.8 16 32 16C39.2 16 45 21.4 45 31V49" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 49H50.5" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="35" r="5" fill="currentColor"/></svg></span>OneGate</div>
      <p class="auth-sub">Credential gateway for AI agents</p>
      <wa-input id="auth-token" name="token" type="password" label="Admin token"
                placeholder="oga_..." required autofocus password-toggle
                autocomplete="off" spellcheck="false"></wa-input>
      <wa-callout id="auth-error" variant="danger" class="hidden"></wa-callout>
      <wa-button type="submit" variant="brand" class="btn-block">Sign in</wa-button>
      <p class="auth-hint">The admin token is printed to the server console on first start.</p>
      <wa-button type="button" appearance="plain" size="s" class="theme-toggle"></wa-button>
    </form>
  </div>

  <!-- Main app shell -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <wa-button id="open-nav" type="button" appearance="plain" aria-label="Open navigation">
        <svg viewBox="0 0 16 16" aria-hidden="true" class="nav-svg"><path d="M1 3h14M1 8h14M1 13h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </wa-button>
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="35" r="10" fill="currentColor" opacity=".16"/><path d="M19 49V31C19 21.4 24.8 16 32 16C39.2 16 45 21.4 45 31V49" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 49H50.5" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="35" r="5" fill="currentColor"/></svg></span>OneGate</div>
    </header>

    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="35" r="10" fill="currentColor" opacity=".16"/><path d="M19 49V31C19 21.4 24.8 16 32 16C39.2 16 45 21.4 45 31V49" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 49H50.5" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="35" r="5" fill="currentColor"/></svg></span>OneGate</div>
      <nav id="nav" class="nav" aria-label="Main">
        <a href="#/dashboard" data-view="dashboard">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1h6v6H1zM9 1h6v6H9zM1 9h6v6H1zM9 9h6v6H9z"/></svg>
          Dashboard
        </a>
        <a href="#/agents" data-view="agents">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3.2"/><path d="M2 15a6 6 0 0 1 12 0z"/></svg>
          Agents
        </a>
        <a href="#/projects" data-view="projects">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 3h5l1.5 2H15v8H1z"/></svg>
          Projects
        </a>
        <a href="#/integrations" data-view="integrations">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1v4M11 1v4M3 5h10v4a5 5 0 0 1-10 0zM8 14v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          Integrations
        </a>
        <a href="#/connections" data-view="connections">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.2" cy="8" r="2.1"/><circle cx="12.8" cy="3.2" r="2.1"/><circle cx="12.8" cy="12.8" r="2.1"/><path d="M5.1 7 11 3.9M5.1 9 11 12.1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          Connections
        </a>
        <a href="#/rules" data-view="rules">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 14 3.5v4c0 3.5-2.5 6.3-6 7.5-3.5-1.2-6-4-6-7.5v-4z"/></svg>
          Rules
        </a>
        <a href="#/audit" data-view="audit">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13h2V7H2zM7 13h2V3H7zM12 13h2V9h-2z"/></svg>
          Audit
        </a>
        <a href="#/usage" data-view="usage">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 14h14M1.5 12.5 6 8l3 3 5.5-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Usage
        </a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-ext" href="/ca.pem" download="onegate-ca.pem" title="Download root CA">Root CA (ca.pem)</a>
        <wa-button type="button" appearance="plain" size="s" class="theme-toggle btn-block"></wa-button>
        <wa-button id="logout" type="button" appearance="plain" size="s" class="btn-block">Log out</wa-button>
      </div>
    </aside>

    <!-- Mobile navigation drawer -->
    <wa-drawer id="nav-drawer" placement="start" label="OneGate">
      <nav id="drawer-nav" class="nav" aria-label="Main"></nav>
      <div class="sidebar-footer">
        <a class="nav-ext" href="/ca.pem" download="onegate-ca.pem">Root CA (ca.pem)</a>
        <wa-button type="button" appearance="plain" size="s" class="theme-toggle btn-block"></wa-button>
        <wa-button id="logout-drawer" type="button" appearance="plain" size="s" class="btn-block">Log out</wa-button>
      </div>
    </wa-drawer>

    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <!-- Modal -->
  <wa-dialog id="modal" light-dismiss></wa-dialog>

  <!-- Toast region -->
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
